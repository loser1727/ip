<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🌟 无限攀登 · 纯净版</title>
    <style>
        :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        body {
            background: #1a1a2e; display: flex; justify-content: center; align-items: center;
            height: 100vh; height: 100dvh; width: 100vw; overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif; touch-action: none; position: fixed; top: 0; left: 0;
        }
        canvas { display: block; background: #000; max-width: 100vw; max-height: 100vh; cursor: pointer; image-rendering: auto; }
        #settings-panel {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 40, 0.95); color: #fff; padding: 20px 25px; border-radius: 16px;
            font-size: 14px; z-index: 200; flex-direction: column; gap: 15px; backdrop-filter: blur(10px);
            border: 1px solid #ff9800; box-shadow: 0 0 25px rgba(255,152,0,0.3); min-width: 260px;
            pointer-events: auto; touch-action: auto; user-select: auto;
        }
        #settings-panel.active { display: flex; }
        .slider-group { display: flex; flex-direction: column; gap: 6px; }
        .slider-group label { font-size: 13px; display: flex; justify-content: space-between; }
        input[type=range] { width: 100%; accent-color: #ff9800; }
        #settings-panel button {
            background: #ff9800; border: none; color: #000; border-radius: 8px; padding: 10px;
            font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="settings-panel">
        <div class="slider-group">
            <label>平台间距系数 <span id="spacing-val">0.65</span></label>
            <input type="range" id="spacing-slider" min="0.5" max="1.0" step="0.05" value="0.65">
        </div>
        <div class="slider-group">
            <label>平台移动速度 <span id="speed-val">150</span></label>
            <input type="range" id="speed-slider" min="20" max="150" step="10" value="150">
        </div>
        <button id="back-from-settings">返回主菜单</button>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // ==================== 响应式 & 高清适配 ====================
            let W, H, scale, dpr;

            function resizeCanvas() {
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                const maxW = window.innerWidth,
                    maxH = window.innerHeight;
                const ratio = 400 / 700;
                if (maxW / maxH < ratio) { W = maxW; H = maxW / ratio; }
                else { H = maxH; W = maxH * ratio; }
                if (W <= 0 || H <= 0) { W = 400; H = 700; }
                scale = W / 400;
                canvas.width = Math.floor(W * dpr);
                canvas.height = Math.floor(H * dpr);
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ==================== 可调参数 ====================
            let platformSpacingFactor = 0.65;
            let platformSpeed = 150;

            const settingsPanel = document.getElementById('settings-panel');
            const spacingSlider = document.getElementById('spacing-slider');
            const speedSlider = document.getElementById('speed-slider');
            const spacingVal = document.getElementById('spacing-val');
            const speedVal = document.getElementById('speed-val');
            const backFromSettingsBtn = document.getElementById('back-from-settings');

            function updateSliderLabels() {
                spacingVal.textContent = platformSpacingFactor.toFixed(2);
                speedVal.textContent = platformSpeed;
            }
            spacingSlider.addEventListener('input', () => {
                platformSpacingFactor = parseFloat(spacingSlider.value);
                updateSliderLabels();
                recalcPlatformSpacing();
            });
            speedSlider.addEventListener('input', () => {
                platformSpeed = parseInt(speedSlider.value, 10);
                updateSliderLabels();
            });
            backFromSettingsBtn.addEventListener('click', () => {
                scene = 'start';
                settingsPanel.classList.remove('active');
            });
            updateSliderLabels();

            // ==================== 跳跃高度与平台间距 ====================
            const GRAVITY = 1500;

            function getBallJumpHeight() {
                const jumpStr = -900 * scale;
                return (jumpStr * jumpStr) / (2 * GRAVITY * scale);
            }

            function getPlatformSpacing() {
                return getBallJumpHeight() * platformSpacingFactor;
            }

            function recalcPlatformSpacing() {
                if (platforms.length > 1) {
                    const newSpacing = getPlatformSpacing();
                    const firstY = platforms[0].y;
                    for (let i = 1; i < platforms.length; i++) platforms[i].y = firstY - i * newSpacing;
                }
            }

            // ==================== 音频（Web Audio API 实现零延迟音乐） ====================
            let audioCtx = null;
            let musicBuffer = null;           // 解码后的音乐 AudioBuffer
            let currentMusicSource = null;   // 当前正在播放的 BufferSourceNode
            let musicFileInput = null;       // 隐藏文件选择器

            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                }

                // 如果没有音乐缓冲且未加载过，尝试加载默认 1.mp3
                if (!musicBuffer && !musicFileInput) {
                    loadDefaultMusic();
                }
            }

            // 加载默认音乐文件并解码
            function loadDefaultMusic() {
                fetch('1.mp3')
                    .then(response => {
                        if (!response.ok) throw new Error('默认音乐不存在');
                        return response.arrayBuffer();
                    })
                    .then(arrayBuffer => {
                        if (!audioCtx) {
                            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            if (audioCtx.state === 'suspended') audioCtx.resume();
                        }
                        return audioCtx.decodeAudioData(arrayBuffer);
                    })
                    .then(buffer => {
                        musicBuffer = buffer;
                        console.log('默认音乐已加载');
                    })
                    .catch(err => {
                        console.warn('无法加载默认音乐 1.mp3：', err);
                        // 音乐缓冲保持 null，连击时不会播放音乐
                    });
            }

            // 将文件解码为 AudioBuffer（用于导入音乐）
            function decodeMusicFile(arrayBuffer) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                }
                // 兼容旧版回调形式的 decodeAudioData
                return new Promise((resolve, reject) => {
                    audioCtx.decodeAudioData(arrayBuffer,
                        buffer => resolve(buffer),
                        err => reject(err)
                    );
                });
            }

            // 允许用户从本地导入音乐文件
            function importMusic() {
                if (!musicFileInput) {
                    musicFileInput = document.createElement('input');
                    musicFileInput.type = 'file';
                    musicFileInput.accept = 'audio/*';
                    musicFileInput.style.display = 'none';
                    document.body.appendChild(musicFileInput);

                    musicFileInput.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (!file) return;

                        try {
                            // 停止当前音乐
                            stopMusic();
                            // 读取文件
                            const arrayBuffer = await file.arrayBuffer();
                            const buffer = await decodeMusicFile(arrayBuffer);
                            musicBuffer = buffer;
                            console.log('导入音乐成功');
                        } catch (err) {
                            console.error('导入音乐失败：', err);
                        }
                    });
                }
                // 触发文件选择
                musicFileInput.click();
            }

            // 音效函数
            function playSound(f, d, t = 'sine', v = 0.1, g = 0) {
                if (!audioCtx) return;
                const o = audioCtx.createOscillator(),
                    gn = audioCtx.createGain();
                o.type = t;
                o.frequency.setValueAtTime(f, audioCtx.currentTime);
                if (g) o.frequency.exponentialRampToValueAtTime(g, audioCtx.currentTime + d);
                gn.gain.setValueAtTime(v, audioCtx.currentTime);
                gn.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + d);
                o.connect(gn);
                gn.connect(audioCtx.destination);
                o.start();
                o.stop(audioCtx.currentTime + d);
            }
            const sfx = {
                jump: () => playSound(400, 0.1, 'sine', 0.1, 600),
                combo: (n) => { let f = 400 + n * 30; playSound(f, 0.15, 'sine', 0.12, f * 1.5); },
                bounce: () => playSound(300, 0.2, 'triangle', 0.15, 800),
                fail: () => playSound(150, 0.4, 'sawtooth', 0.1, 50),
                win: () => { playSound(600, 0.1, 'sine', 0.15, 1000); setTimeout(() => playSound(800, 0.2, 'sine', 0.15, 1200), 150); }
            };

            // 连击音乐控制：开始播放（从头且循环）
            function startMusic() {
                if (!musicBuffer || !audioCtx) return;

                // 先停止旧源
                if (currentMusicSource) {
                    try { currentMusicSource.stop(); } catch (e) {}
                    currentMusicSource.disconnect();
                    currentMusicSource = null;
                }

                // 创建新源，设置为循环
                const source = audioCtx.createBufferSource();
                source.buffer = musicBuffer;
                source.loop = true;
                source.connect(audioCtx.destination);

                source.onended = () => {
                    // 如果是因为 stop() 而结束，会自动触发 onended，但要区分是否 loop 暂停
                    // 当 loop 时，onended 在源被 stop 后触发（或者自然结束时）
                    // 这里无需额外处理
                };

                source.start(0);
                currentMusicSource = source;
            }

            // 停止连击音乐
            function stopMusic() {
                if (currentMusicSource) {
                    try { currentMusicSource.stop(); } catch (e) {}
                    currentMusicSource.disconnect();
                    currentMusicSource = null;
                }
            }

            // ==================== 游戏对象 ====================
            const PLATFORM_TYPE = { NORMAL: 0, MOVING: 1, BOUNCE: 2, CRUMBLE: 3 };
            let gameState = 'PLAYING',
                score = 0,
                bestScore = 0,
                platforms = [],
                comboCount = 0,
                maxComboReached = 0;
            let camY = 0,
                player, platformIdCounter = 0;
            let scene = 'start';
            const levels = [
                { name: '第1关', desc: '触发30次连击', target: 30, unlocked: true, type: 'combo' },
                { name: '第2关', desc: '达到2000m & 连击≥30', target: 2000, unlocked: true, type: 'distance' },
                { name: '第3关', desc: '3个平台·30连击', target: 30, unlocked: true, type: 'combo' }
            ];
            let currentLevel = 0;

            class Player {
                constructor() {
                    this.radius = 15 * scale;
                    this.reset();
                }
                reset() {
                    this.x = W / 2;
                    this.y = H - 100 * scale;
                    this.vx = 0;
                    this.vy = 0;
                    this.onGround = false;
                    this.lastPlatformId = -1;
                }
                update(dt) {
                    const gravity = GRAVITY * scale,
                        jumpStr = -750 * scale;
                    if (input.left) this.vx = -300 * scale;
                    else if (input.right) this.vx = 300 * scale;
                    else this.vx *= 0.8;
                    this.vy += gravity * dt;
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;
                    if (this.x < this.radius) this.x = this.radius;
                    if (this.x > W - this.radius) this.x = W - this.radius;

                    if (this.vy > 0) {
                        const prevCombo = comboCount;

                        platforms.forEach(p => {
                            if (!p.broken && this.y + this.radius > p.y && this.y < p.y + p.h &&
                                this.x + this.radius > p.x && this.x - this.radius < p.x + p.w) {

                                if (p.id !== this.lastPlatformId) {
                                    comboCount++;
                                    maxComboReached = Math.max(maxComboReached, comboCount);
                                    this.lastPlatformId = p.id;

                                    comboCount > 1 ? sfx.combo(comboCount) : sfx.jump();

                                    // 连击开始时启动音乐
                                    if (comboCount === 1 && prevCombo === 0) {
                                        startMusic();
                                    }

                                    if (gameState === 'PLAYING') {
                                        const level = levels[currentLevel];
                                        if (level.type === 'combo' && comboCount >= level.target) {
                                            gameState = 'WIN';
                                            sfx.win();
                                            stopMusic();
                                        } else if (level.type === 'distance' && score >= level.target && maxComboReached >= 30) {
                                            gameState = 'WIN';
                                            sfx.win();
                                            stopMusic();
                                        }
                                    }
                                } else {
                                    // 连击中断
                                    if (comboCount > 0) stopMusic();
                                    comboCount = 0;
                                    this.lastPlatformId = p.id;
                                    sfx.jump();
                                }

                                if (p.type === PLATFORM_TYPE.BOUNCE) {
                                    this.vy = jumpStr * 1.5;
                                    sfx.bounce();
                                } else {
                                    this.vy = jumpStr;
                                    if (p.type === PLATFORM_TYPE.CRUMBLE) p.broken = true;
                                }
                            }
                        });
                    }
                    if (this.y - camY > H + 100 && gameState === 'PLAYING') gameOver();
                }
                draw() {
                    ctx.fillStyle = '#ff9800';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y - camY, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(this.x - 5 * scale, this.y - camY - 2 * scale, 3 * scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(this.x + 5 * scale, this.y - camY - 2 * scale, 3 * scale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            class Platform {
                constructor(y, type, isStart = false) {
                    this.id = platformIdCounter++;
                    this.w = isStart ? (W * 0.4) : (60 + Math.random() * 40) * scale;
                    this.h = 12 * scale;
                    this.x = isStart ? (W / 2 - this.w / 2) : Math.random() * (W - this.w);
                    this.y = y;
                    this.type = type;
                    this.broken = false;
                    this.moveDir = Math.random() > 0.5 ? 1 : -1;
                }
                update(dt) {
                    if (this.type === PLATFORM_TYPE.MOVING) {
                        this.x += this.moveDir * platformSpeed * scale * dt;
                        if (this.x <= 0) { this.x = 0; this.moveDir = 1; }
                        else if (this.x + this.w >= W) { this.x = W - this.w; this.moveDir = -1; }
                    }
                }
                draw() {
                    if (this.broken) return;
                    const colors = ['#8bc34a', '#03a9f4', '#ffeb3b', '#f44336'];
                    ctx.fillStyle = colors[this.type];
                    ctx.beginPath();
                    ctx.roundRect(this.x, this.y - camY, this.w, this.h, 5);
                    ctx.fill();
                }
            }

            // ==================== 输入处理 ====================
            const input = { left: false, right: false };

            function getCanvasPos(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = W / rect.width,
                    scaleY = H / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            }

            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                if (scene === 'settings') return;
                initAudio();
                const pos = getCanvasPos(e);
                handleSceneClick(pos);
                if (scene === 'game' && gameState === 'PLAYING') {
                    if (pos.x < W / 2) input.left = true;
                    else input.right = true;
                }
            });
            canvas.addEventListener('touchend', () => { input.left = input.right = false; });
            canvas.addEventListener('mousedown', e => {
                if (scene === 'settings') return;
                initAudio();
                const pos = getCanvasPos(e);
                handleSceneClick(pos);
                if (scene === 'game' && gameState === 'PLAYING') {
                    if (pos.x < W / 2) input.left = true;
                    else input.right = true;
                }
            });
            canvas.addEventListener('mouseup', () => { input.left = input.right = false; });
            window.addEventListener('keydown', e => {
                if (scene === 'game' && gameState === 'PLAYING') {
                    if (e.key === 'ArrowLeft') input.left = true;
                    if (e.key === 'ArrowRight') input.right = true;
                }
            });
            window.addEventListener('keyup', e => {
                if (e.key === 'ArrowLeft') input.left = false;
                if (e.key === 'ArrowRight') input.right = false;
            });

            function handleSceneClick(pos) {
                if (scene === 'start') {
                    const startBtn = startButton();
                    if (pos.x >= startBtn.x && pos.x <= startBtn.x + startBtn.w && pos.y >= startBtn.y && pos.y <= startBtn.y + startBtn.h) {
                        scene = 'levelSelect';
                    }
                    const settingsBtn = settingsButton();
                    if (pos.x >= settingsBtn.x && pos.x <= settingsBtn.x + settingsBtn.w && pos.y >= settingsBtn.y && pos.y <= settingsBtn.y + settingsBtn.h) {
                        scene = 'settings';
                        settingsPanel.classList.add('active');
                        spacingSlider.value = platformSpacingFactor;
                        speedSlider.value = platformSpeed;
                        updateSliderLabels();
                    }
                    const importBtn = importMusicButton();
                    if (pos.x >= importBtn.x && pos.x <= importBtn.x + importBtn.w && pos.y >= importBtn.y && pos.y <= importBtn.y + importBtn.h) {
                        importMusic();
                    }
                } else if (scene === 'levelSelect') {
                    levelButtons().forEach((btn, idx) => {
                        if (levels[idx].unlocked && pos.x >= btn.x && pos.x <= btn.x + btn.w && pos.y >= btn.y && pos.y <= btn.y + btn.h) {
                            currentLevel = idx;
                            stopMusic();
                            startGame();
                        }
                    });
                    const back = backButton();
                    if (pos.x >= back.x && pos.x <= back.x + back.w && pos.y >= back.y && pos.y <= back.y + back.h) {
                        scene = 'start';
                        stopMusic();
                    }
                } else if (scene === 'game') {
                    if (gameState === 'OVER') restart();
                    else if (gameState === 'WIN') {
                        stopMusic();
                        scene = 'levelSelect';
                        gameState = 'PLAYING';
                        comboCount = 0;
                    }
                }
            }

            function startButton() {
                const btnW = 180 * scale, btnH = 50 * scale;
                return { x: W / 2 - btnW / 2, y: H * 0.60, w: btnW, h: btnH };
            }

            function settingsButton() {
                const btnW = 180 * scale, btnH = 40 * scale;
                return { x: W / 2 - btnW / 2, y: H * 0.68, w: btnW, h: btnH };
            }

            function importMusicButton() {
                const btnW = 180 * scale, btnH = 40 * scale;
                return { x: W / 2 - btnW / 2, y: H * 0.76, w: btnW, h: btnH };
            }

            function backButton() {
                const btnW = 100 * scale, btnH = 40 * scale;
                return { x: 20 * scale, y: 20 * scale, w: btnW, h: btnH };
            }

            function levelButtons() {
                const btns = [];
                const startY = H * 0.4, gap = 70 * scale;
                for (let i = 0; i < levels.length; i++) {
                    const btnW = 220 * scale, btnH = 50 * scale;
                    btns.push({ x: W / 2 - btnW / 2, y: startY + i * gap, w: btnW, h: btnH });
                }
                return btns;
            }

            function startGame() {
                resizeCanvas();
                score = 0;
                camY = 0;
                comboCount = 0;
                maxComboReached = 0;
                platformIdCounter = 0;
                stopMusic();
                player = new Player();
                platforms = [];
                const startY = player.y + player.radius;
                const spacing = getPlatformSpacing();

                if (currentLevel === 2) {
                    platforms.push(new Platform(startY, PLATFORM_TYPE.NORMAL, true));
                    platforms.push(new Platform(startY - spacing, PLATFORM_TYPE.MOVING));
                    platforms.push(new Platform(startY - 2 * spacing, PLATFORM_TYPE.MOVING));
                } else {
                    platforms.push(new Platform(startY, PLATFORM_TYPE.NORMAL, true));
                    for (let i = 1; i < 12; i++) {
                        platforms.push(new Platform(startY - i * spacing, PLATFORM_TYPE.MOVING));
                    }
                }

                gameState = 'PLAYING';
                scene = 'game';
                settingsPanel.classList.remove('active');
            }

            function restart() {
                stopMusic();
                startGame();
            }

            function gameOver() {
                if (gameState !== 'PLAYING') return;
                gameState = 'OVER';
                bestScore = Math.max(score, bestScore);
                comboCount = 0;
                stopMusic();
                sfx.fail();
            }

            function drawRoundedButton(x, y, w, h, text, color, textColor = '#fff') {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 10);
                ctx.fill();
                ctx.fillStyle = textColor;
                ctx.font = `${18*scale}px "PingFang SC", Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x + w / 2, y + h / 2);
            }

            function drawStartScene() {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#0f0c29');
                grad.addColorStop(0.5, '#302b63');
                grad.addColorStop(1, '#24243e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${30*scale}px "PingFang SC", Arial`;
                ctx.textAlign = 'center';
                ctx.fillText('🌟 无限攀登', W / 2, H * 0.3);
                ctx.font = `${16*scale}px "PingFang SC", Arial`;
                ctx.fillText(`最高记录: ${bestScore}m`, W / 2, H * 0.4);
                ctx.font = `${13*scale}px "PingFang SC", Arial`;
                ctx.fillText(`间距:${platformSpacingFactor.toFixed(2)} | 速度:${platformSpeed}`, W / 2, H * 0.48);
                drawRoundedButton(startButton().x, startButton().y, startButton().w, startButton().h, '开始游戏', '#ff9800');
                drawRoundedButton(settingsButton().x, settingsButton().y, settingsButton().w, settingsButton().h, '⚙️ 控制台', '#555');
                drawRoundedButton(importMusicButton().x, importMusicButton().y, importMusicButton().w, importMusicButton().h, '🎵 导入音乐', '#4caf50');
            }

            function drawLevelSelectScene() {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, W, H);
                drawRoundedButton(backButton().x, backButton().y, backButton().w, backButton().h, '← 返回', '#555');
                ctx.fillStyle = '#fff';
                ctx.font = `bold ${26*scale}px "PingFang SC", Arial`;
                ctx.textAlign = 'center';
                ctx.fillText('选择关卡', W / 2, H * 0.2);
                const btns = levelButtons();
                levels.forEach((lvl, i) => {
                    const btn = btns[i];
                    const color = lvl.unlocked ? '#4caf50' : '#555';
                    const text = lvl.unlocked ? `${lvl.name}: ${lvl.desc}` : `${lvl.name} (🔒)`;
                    drawRoundedButton(btn.x, btn.y, btn.w, btn.h, text, color);
                });
            }

            function drawGameScene() {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, W, H);
                platforms.forEach(p => p.draw());
                player.draw();

                ctx.fillStyle = '#fff';
                ctx.font = `bold ${20*scale}px "PingFang SC", Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(`高度: ${score}m`, W / 2, 40 * scale);

                if (comboCount > 1 && gameState === 'PLAYING') {
                    ctx.fillStyle = '#ffeb3b';
                    ctx.font = `bold ${24*scale}px "PingFang SC", Arial`;
                    ctx.fillText(`🔥 ${comboCount} 连击!`, W / 2, 90 * scale);
                }
                if (maxComboReached > 1) {
                    ctx.fillStyle = '#aaa';
                    ctx.font = `${14*scale}px "PingFang SC", Arial`;
                    ctx.fillText(`最高连击: ${maxComboReached}`, W / 2, 110 * scale);
                }

                if (gameState === 'OVER') {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#fff';
                    ctx.font = `bold ${24*scale}px "PingFang SC", Arial`;
                    ctx.fillText('游戏结束', W / 2, H / 2 - 20 * scale);
                    ctx.fillText(`最高分: ${bestScore}m`, W / 2, H / 2 + 20 * scale);
                    ctx.font = `${14*scale}px "PingFang SC", Arial`;
                    ctx.fillText('点击屏幕重新开始', W / 2, H / 2 + 60 * scale);
                } else if (gameState === 'WIN') {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#ffeb3b';
                    ctx.font = `bold ${28*scale}px "PingFang SC", Arial`;
                    ctx.fillText('🎉 关卡完成！', W / 2, H / 2 - 30 * scale);
                    ctx.fillStyle = '#fff';
                    ctx.font = `${18*scale}px "PingFang SC", Arial`;
                    let winMsg = levels[currentLevel].type === 'combo' ?
                        `达成了 ${levels[currentLevel].target} 连击` :
                        `达到2000m！最高连击${maxComboReached}`;
                    ctx.fillText(winMsg, W / 2, H / 2 + 20 * scale);
                    ctx.font = `${14*scale}px "PingFang SC", Arial`;
                    ctx.fillText('点击屏幕返回关卡选择', W / 2, H / 2 + 60 * scale);
                }
            }

            let lastTime = 0;

            function loop(t) {
                const dt = Math.min((t - lastTime) / 1000, 0.1);
                lastTime = t;

                if (scene === 'start') {
                    drawStartScene();
                } else if (scene === 'levelSelect') {
                    drawLevelSelectScene();
                } else if (scene === 'game') {
                    if (gameState === 'PLAYING') {
                        player.update(dt);
                        if (player.y < camY + H / 2) camY = player.y - H / 2;
                        score = Math.max(score, Math.floor(-player.y / 10 + 70));
                        platforms.forEach(p => p.update(dt));
                        if (currentLevel !== 2 && platforms.length > 0 && platforms[platforms.length - 1].y > camY - 100 * scale) {
                            const lastY = platforms[platforms.length - 1].y;
                            platforms.push(new Platform(lastY - getPlatformSpacing(), PLATFORM_TYPE.MOVING));
                        }
                        platforms = platforms.filter(p => p.y < camY + H + 100 * scale);

                        if (levels[currentLevel].type === 'distance' && score >= 2000 && maxComboReached >= 30 && gameState === 'PLAYING') {
                            gameState = 'WIN';
                            sfx.win();
                            stopMusic();
                        }
                    }
                    drawGameScene();
                } else if (scene === 'settings') {
                    ctx.fillStyle = '#0f0c29';
                    ctx.fillRect(0, 0, W, H);
                    ctx.fillStyle = '#fff';
                    ctx.font = `${20*scale}px "PingFang SC", Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('调整参数后点击下方按钮返回', W / 2, H * 0.3);
                }

                requestAnimationFrame(loop);
            }

            window.addEventListener('load', () => {
                resizeCanvas();
                scene = 'start';
                settingsPanel.classList.remove('active');
                requestAnimationFrame(loop);
            });
        })();
    </script>
</body>
</html>
